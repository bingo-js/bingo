name: Post Release

on:
  release:
    types:
      - published

jobs:
  post_release:
    name: Post Release
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: apexskier/github-release-commenter@v1.4.1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          comment-template: |
            :tada: This has been released in **{release_tag}** :tada:

            The release is available on [GitHub releases]({release_link}).

            Cheers! 📦🚀
