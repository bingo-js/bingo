name: Release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  select_mode:
    name: Select Mode
    if: github.event.repository.fork != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select_mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select_mode.outputs.publish-plan-artifact-id }}
    steps:
      - uses: $/.github/actions/setup
      - uses: changesets/action/select-mode@v2.1.2
        id: select_mode

  version:
    name: Version
    if: needs.select_mode.outputs.mode == 'version'
    needs: select_mode
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: $/.github/actions/setup

      - name: Create Token
        id: create_token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.RELEASEBOT_APP_CLIENT_ID }}
          permission-contents: write
          permission-pull-requests: write
          private-key: ${{ secrets.RELEASEBOT_APP_PRIVATE_KEY }}

      - name: Version Packages
        uses: changesets/action/version@v2.1.2
        with:
          github-token: ${{ steps.create_token.outputs.token }}

  pack:
    name: Pack
    if: needs.select_mode.outputs.mode == 'publish'
    needs: select_mode
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: $/.github/actions/setup
        with:
          cache: false

      - name: Prebuild
        run: pnpm run -r prebuild

      - name: Build
        run: pnpm build

      - name: Pack
        uses: changesets/action/pack@v2.1.2
        id: pack
        with:
          publish-plan-artifact-id: ${{ needs.select_mode.outputs.publish-plan-artifact-id }}

  publish:
    name: Publish
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
      published-packages: ${{ steps.publish.outputs['published-packages'] }}
    steps:
      - uses: $/.github/actions/setup

      - name: Create Token
        id: create_token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.RELEASEBOT_APP_CLIENT_ID }}
          permission-contents: write
          private-key: ${{ secrets.RELEASEBOT_APP_PRIVATE_KEY }}

      - name: Publish Packages
        id: publish
        uses: changesets/action/publish@v2.1.2
        with:
          github-token: ${{ steps.create_token.outputs.token }}
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}

  comment:
    if: needs.publish.outputs.published == 'true'
    name: Comment on Released PRs and Issues
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: marcalexiei/changesets-release-commenter@v0.3.1
        with:
          published-packages: ${{ needs.publish.outputs['published-packages'] }}
