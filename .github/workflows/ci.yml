name: CI

on:
  pull_request: ~
  push:
    branches:
      - main

permissions: {}

jobs:
  actions_security:
    name: GitHub Actions Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - parallel:
          - name: Verify Workflow Lockfile
            run: |
              gh extension install github/gh-actions-lock
              gh actions-lock --verify
            env:
              GH_TOKEN: ${{ github.token }}
          - name: Run Zizmor
            uses: zizmorcore/zizmor-action@v0.9.2
            with:
              advanced-security: 'false'
              annotations: 'true'

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: $/.github/actions/setup
      - run: pnpm build

  build_site:
    name: Build Site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: $/.github/actions/setup
      - run: pnpm site:build

  dedupe_check:
    name: Dedupe Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: $/.github/actions/setup
      - run: pnpm dedupe --check

  engines_check:
    name: Engines Check (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24.15.0
          - 24
          - 26.0.0
          - 26
    steps:
      - uses: $/.github/actions/setup
        with:
          cache: false
          install-flags: --prod --engine-strict --ignore-scripts
          node-version: ${{ matrix.node-version }}

  format_check:
    name: Format Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: $/.github/actions/setup
      - run: pnpm format --list-different

  knip:
    name: Knip
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: $/.github/actions/setup
      - run: pnpm knip

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: $/.github/actions/setup
      - run: pnpm --filter=site prebuild
      - run: pnpm lint

  lint_spelling:
    name: Lint Spelling
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: $/.github/actions/setup
      - run: pnpm lint:spelling

  test_node:
    name: Test (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24.15.0
          - 24
          - 26.0.0
          - 26
    steps:
      - uses: $/.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}
      - run: pnpm test

  test_os:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: $/.github/actions/setup
      - run: pnpm test ${{ matrix.os == 'ubuntu-latest' && '--coverage' || '' }}
      - uses: codecov/codecov-action@v7.1.1 # v7
        if: success() && (matrix.os == 'ubuntu-latest')
        with:
          fail_ci_if_error: true
          use_oidc: true

  type_check:
    name: Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: $/.github/actions/setup
      - run: pnpm typecheck
