name: Setup

description: Sets up the repo for a typical CI job

inputs:
  cache:
    description: Cache the pnpm store
    default: true
    required: false
  install-flags:
    description: Flags to pass to `pnpm install`
    required: false
    type: string
  node-version:
    description: Node.js version to use
    default: 26.13.0
    required: false

runs:
  steps:
    - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
      with:
        cache: ${{ inputs.cache }}
        install: ${{ inputs.install-flags == '' }}
        runtime: node@${{ inputs.node-version }}
    - run: pnpm install ${{ inputs.install-flags }}
      if: ${{ inputs.install-flags != '' }}
      shell: bash
  using: composite
